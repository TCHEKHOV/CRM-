<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pointage Pro Enterprise</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<!-- Crypto -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#1f2937;--primary:#2563eb;
}
.dark{
  --bg:#0f172a;--card:#1e293b;--text:#f8fafc;
}
body{margin:0;font-family:Segoe UI;background:var(--bg);color:var(--text)}
header{background:var(--primary);color:white;padding:15px;display:flex;justify-content:space-between}
.card{background:var(--card);margin:10px;padding:15px;border-radius:12px}
button{background:var(--primary);color:white;border:none;padding:8px 12px;border-radius:6px}
input,select{width:100%;padding:8px;margin:5px 0}
.hidden{display:none}
.chat{height:220px;overflow:auto;background:#00000010;padding:10px;border-radius:8px}
.msg{margin-bottom:5px}
.flex{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>

<body>

<header>
  <b>🏢 Pointage Pro Enterprise</b>
  <button onclick="toggleTheme()">🌗 Thème</button>
</header>

<!-- LOGIN -->
<div id="login" class="card">
  <h3>Connexion</h3>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Mot de passe">
  <button onclick="login()">Connexion</button>
</div>

<!-- ADMIN -->
<div id="adminPanel" class="hidden">
  <div class="flex">
    <div class="card" style="flex:1">
      <h3>👑 Admin</h3>
      <p>Les utilisateurs se créent dans Firebase Auth</p>
    </div>

    <div class="card" style="flex:1">
      <h3>📍 Pointages</h3>
      <button onclick="exportCSV()">⬇ Export CSV</button>
      <ul id="pointages"></ul>
    </div>
  </div>

  <div class="card">
    <h3>💬 Supervision Chat</h3>
    <div class="chat" id="adminChat"></div>
  </div>
</div>

<!-- AGENT -->
<div id="agentPanel" class="hidden">
  <div class="card">
    <h3>👤 <span id="agentName"></span></h3>
    <button onclick="pointage('ENTREE')">🟢 Entrée</button>
    <button onclick="pointage('SORTIE')">🔴 Sortie</button>
  </div>

  <div class="card">
    <h3>💬 Chat</h3>
    <select id="chatTo">
      <option value="public">Public</option>
      <option value="admin">Admin</option>
    </select>
    <div class="chat" id="agentChat"></div>
    <input id="msg" placeholder="Message">
    <button onclick="sendMsg()">Envoyer</button>
  </div>
</div>

<script>
/* 🔥 FIREBASE CONFIG */
firebase.initializeApp({
  apiKey: "AIzaSyAf_CiHyO4JXUL_nncMfwP_SH_9by5LBuY",
  authDomain: "crm-7ed6f.firebaseapp.com",
  projectId: "crm-7ed6f"
});
const auth=firebase.auth();
const db=firebase.firestore();
const SECRET="POINTAGE_SECRET_2026";

/* AUTH */
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(e=>alert(e.message));
}

auth.onAuthStateChanged(user=>{
  if(!user)return;
  db.collection("users").doc(user.uid).get().then(d=>{
    if(!d.exists){ alert("Utilisateur non configuré"); return; }
    let role=d.data().role;
    login.classList.add("hidden");
    agentName.textContent=user.email;
    role==="admin"?adminPanel.classList.remove("hidden"):agentPanel.classList.remove("hidden");
    loadChats(); loadPointages();
  });
});

/* POINTAGE */
function pointage(type){
  db.collection("pointages").add({
    user:auth.currentUser.email,
    type:type,
    time:new Date().toLocaleString()
  });
}

/* CHAT */
function sendMsg(){
  let enc=CryptoJS.AES.encrypt(msg.value,SECRET).toString();
  db.collection("chats").add({
    from:auth.currentUser.email,
    to:chatTo.value,
    msg:enc,
    time:Date.now()
  });
  msg.value="";
}

function loadChats(){
  db.collection("chats").orderBy("time").onSnapshot(s=>{
    adminChat.innerHTML=""; agentChat.innerHTML="";
    s.forEach(d=>{
      let c=d.data();
      let txt=CryptoJS.AES.decrypt(c.msg,SECRET).toString(CryptoJS.enc.Utf8);
      let line=`<div class="msg"><b>${c.from}</b>: ${txt}</div>`;
      adminChat.innerHTML+=line;
      if(c.to==="public"||c.from===auth.currentUser.email||c.to===auth.currentUser.email)
        agentChat.innerHTML+=line;
    });
  });
}

/* POINTAGES */
function loadPointages(){
  db.collection("pointages").onSnapshot(s=>{
    pointages.innerHTML="";
    s.forEach(d=>{
      let p=d.data();
      pointages.innerHTML+=`<li>${p.user} - ${p.type} - ${p.time}</li>`;
    });
  });
}

/* EXPORT CSV */
function exportCSV(){
  db.collection("pointages").get().then(s=>{
    let csv="user,type,time\n";
    s.forEach(d=>{
      let p=d.data();
      csv+=`${p.user},${p.type},${p.time}\n`;
    });
    let a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download="pointages.csv"; a.click();
  });
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
