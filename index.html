<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CRM Pro v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex h-screen">

    <aside class="w-64 bg-slate-900 text-white p-6">
        <h1 class="text-xl font-bold mb-8">PHINGOO CLONE</h1>
        <nav class="space-y-4">
            <div class="text-blue-400 font-bold italic">Tableau de bord</div>
            <div class="hover:text-blue-300 cursor-pointer">Appels</div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col p-8">
        <section class="bg-white p-6 rounded-xl shadow-sm mb-8">
            <h2 class="font-bold mb-4 italic text-gray-700 underline">Ajouter un nouveau Prospect</h2>
            <div class="grid grid-cols-3 gap-4">
                <input id="newNom" type="text" placeholder="Nom Complet" class="border p-2 rounded">
                <input id="newTel" type="text" placeholder="Téléphone" class="border p-2 rounded">
                <button onclick="ajouterLead()" class="bg-blue-600 text-white rounded font-bold hover:bg-blue-700 transition">Enregistrer</button>
            </div>
        </section>

        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-4 text-left">Nom</th>
                        <th class="p-4 text-left">Téléphone</th>
                        <th class="p-4 text-left">Statut</th>
                        <th class="p-4 text-left">Actions</th>
                    </tr>
                </thead>
                <tbody id="leadsTableBody">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        // CONFIGURATION SUPABASE (À remplir)
        const SUPABASE_URL = 'TA_URL_SUPABASE';
        const SUPABASE_KEY = 'TA_CLE_API_ANON';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. Charger les données au démarrage
        async function chargerLeads() {
            const { data, error } = await supabase.from('leads').select('*').order('created_at', { ascending: false });
            if (error) console.log(error);
            
            const tbody = document.getElementById('leadsTableBody');
            tbody.innerHTML = ''; // On vide le tableau

            data.forEach(lead => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-4 font-semibold">${lead.nom}</td>
                        <td class="p-4">${lead.telephone}</td>
                        <td class="p-4"><span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs">${lead.statut}</span></td>
                        <td class="p-4">
                            <button class="text-green-600 hover:scale-110 transition"><i data-lucide="phone"></i></button>
                        </td>
                    </tr>
                `;
            });
            lucide.createIcons();
        }

        // 2. Ajouter un lead
        async function ajouterLead() {
            const nom = document.getElementById('newNom').value;
            const tel = document.getElementById('newTel').value;

            const { error } = await supabase.from('leads').insert([{ nom: nom, telephone: tel }]);
            
            if (error) alert("Erreur lors de l'ajout");
            else {
                document.getElementById('newNom').value = '';
                document.getElementById('newTel').value = '';
                chargerLeads(); // On rafraîchit la liste
            }
        }

        chargerLeads(); // Lancement initial
    </script>
</body>
</html>
